version: 2.1

commands:
  configure-gpg:
    description: |
      Configure GPG private keys.
    steps:
      - run:
          command: echo $ORG_GRADLE_PROJECT_signingKey_base64 | base64 --decode | gpg --batch --no-tty --import --yes
          name: Configure GPG private key for signing project artifacts in OSS Sonatype
  validate-archetype-templates:
    description: |
      Ensure archetype templates keep tokenized values so release/version changes are automatic.
    steps:
      - run:
          name: Validate archetype templates
          command: |
            set -euo pipefail

            err=0

            while IFS= read -r -d '' f; do
              if ! grep -q '<synapse.version>@project.version@</synapse.version>' "$f"; then
                echo "ERROR: $f must contain <synapse.version>@project.version@</synapse.version>"
                err=1
              fi
              if ! grep -q '<artifactId>maven-compiler-plugin</artifactId>' "$f"; then
                echo "ERROR: $f missing maven-compiler-plugin"
                err=1
              fi
              if ! grep -q '<version>@maven.compiler.plugin.version@</version>' "$f"; then
                echo "ERROR: $f must contain <version>@maven.compiler.plugin.version@</version> for maven-compiler-plugin"
                err=1
              fi
            done < <(find archetype -path '*/src/main/resources/archetype-resources/pom.xml' -type f -print0)

            while IFS= read -r -d '' f; do
              if ! grep -q 'requiredProperty key="javaVersion"' "$f"; then
                echo "ERROR: $f missing requiredProperty key=\"javaVersion\""
                err=1
              fi
              if ! grep -q '<defaultValue>@maven.compiler.source@</defaultValue>' "$f"; then
                echo "ERROR: $f must contain <defaultValue>@maven.compiler.source@</defaultValue>"
                err=1
              fi
            done < <(find archetype -path '*/src/main/resources/META-INF/maven/archetype-metadata.xml' -type f -print0)

            if [ "$err" -ne 0 ]; then
              exit 1
            fi

#-------------------------------------------------------
# Jobs that will execute maven goals and git commands.
#-------------------------------------------------------
jobs:
  # Build and Test
  build-test-job:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - validate-archetype-templates
      - restore_cache:
          keys:
            - synapse-{{ checksum "pom.xml" }}
            - synapse-
      - run: ./mvnw --batch-mode --define style.color=always clean package
      - save_cache: # saves the project dependencies
          paths:
            - ~/.m2/repository
          key: synapse-{{ checksum "pom.xml" }}
      - run: ./mvnw --batch-mode --define style.color=always verify
      - store_test_results: # We use this timing data to optimize the future runs
          path: target/surefire-reports

  # Test
  test-job:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - validate-archetype-templates
      - restore_cache:
          keys:
            - synapse-{{ checksum "pom.xml" }}
            - synapse-
      - run: ./mvnw --batch-mode --define style.color=always clean test
      - store_test_results: # We use this timing data to optimize the future runs
          path: target/surefire-reports


  # SNAPSHOT Deploy to Maven Central
  snapshot-maven-central-deploy-job:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - synapse-{{ checksum "pom.xml" }}
            - synapse-
      - configure-gpg
      - run: ./mvnw --settings ".circleci/settings.xml" --batch-mode --define style.color=always --errors --activate-profiles snapshot --define skipTests clean deploy # uses maven-deploy-plugin


  # SNAPSHOT to RELEASE Deploy to Maven Central
  snapshot-release-maven-central-deploy-job:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - synapse-{{ checksum "pom.xml" }}
            - synapse-
      - configure-gpg
      - run:
          name: Configure Git
          command: |
            git config user.email "gabriel.a.jimenez@aexp.com"
            git config user.name "Gabriel Jimenez"
      - add_ssh_keys:
          fingerprints:
            - "0a:8a:6d:3a:22:28:74:a8:9e:a6:72:5d:bc:2b:aa:fe"
      - run: ./mvnw --settings ".circleci/settings.xml" --batch-mode --define style.color=always --errors --activate-profiles release --define scmCommentPrefix="[skip ci]" release:clean release:prepare release:perform  # uses maven-release-plugin

  # RELEASE Deploy to Maven Central
  release-maven-central-deploy-job:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - synapse-{{ checksum "pom.xml" }}
            - synapse-
      - configure-gpg
      - run: ./mvnw --settings ".circleci/settings.xml" --batch-mode --define style.color=always --errors --activate-profiles release --define skipTests clean deploy # uses maven-deploy-plugin

#-------------------------------------------------------
# Workflows that will schedule and execute jobs.
#-------------------------------------------------------
workflows:
  # Branch with Snapshot Modifier
  # This workflow is to start automatically when creating any new feature branches and when pushing any changes to feature or develop branches
  snapshot-maven-central-build-test-deploy-workflow:
    jobs:
      - build-test-job:
          filters:
            branches:
              only:
                - develop
                - /^feature\/.*/
                - /^bugfix\/.*/
                - /^dependabot\/.*/
      - snapshot-maven-central-deploy-job:
          filters:
            branches:
              only:
                - develop
                - /^feature\/.*/
                - /^bugfix\/.*/
                - /^dependabot\/.*/
          context:
            - maven_central_credentials
            - code_signing_credentials
          requires:
            - build-test-job

  # Main Branch
  # This workflow is to start automatically when merging any changes to the main branch
  release-maven-central-build-test-deploy-workflow:
    jobs:
      - build-test-job:
          filters:
            branches:
              only:
                - main
      - release-maven-central-deploy-job:
          filters:
            branches:
              only:
                - main
          context:
            - maven_central_credentials
            - code_signing_credentials
          requires:
            - build-test-job

#  # Release Branch
#  # This workflow is to start automatically when creating any new release branches and when pushing any changes to release branches
  snapshot-release-maven-central-build-test-deploy-workflow:
    jobs:
      - build-test-job:
          filters:
            branches:
              only:
                - /^release\/.*/
      - snapshot-release-maven-central-deploy-job:
          filters:
            branches:
              only:
                - /^release\/.*/
          context:
            - maven_central_credentials
            - code_signing_credentials
          requires:
            - build-test-job
