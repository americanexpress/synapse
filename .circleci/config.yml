version: 2.1

commands:
  configure-gpg:
    description: |
      Configure GPG private keys.
    steps:
      - run:
          command: echo $ORG_GRADLE_PROJECT_signingKey_base64 | base64 --decode | gpg --batch --no-tty --import --yes
          name: Configure GPG private key for signing project artifacts in OSS Sonatype

#-------------------------------------------------------
# Jobs that will execute maven goals and git commands.
#-------------------------------------------------------
jobs:
  # Build and Test
  build-test-job:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - synapse-{{ checksum "pom.xml" }}
            - synapse-
      - run: mvn --batch-mode --define style.color=always clean package
      - save_cache: # saves the project dependencies
          paths:
            - ~/.m2/repository
          key: synapse-{{ checksum "pom.xml" }}
      - run: mvn --batch-mode --define style.color=always verify
      - store_test_results: # We use this timing data to optimize the future runs
          path: target/surefire-reports

  # Test
  test-job:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - synapse-{{ checksum "pom.xml" }}
            - synapse-
      - run: mvn --batch-mode --define style.color=always clean test
      - store_test_results: # We use this timing data to optimize the future runs
          path: target/surefire-reports


  # SNAPSHOT Deploy to Maven Central
  snapshot-maven-central-deploy-job:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - synapse-{{ checksum "pom.xml" }}
            - synapse-
      - configure-gpg
      - run: mvn --settings ".circleci/settings.xml" --batch-mode --define style.color=always --errors --activate-profiles snapshot --define skipTests clean deploy # uses maven-deploy-plugin


  # SNAPSHOT to RELEASE Deploy to Maven Central
  snapshot-release-maven-central-deploy-job:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - synapse-{{ checksum "pom.xml" }}
            - synapse-
      - configure-gpg
      - run:
          name: Configure Git
          command: |
            git config user.email "gabriel.a.jimenez@aexp.com"
            git config user.name "Gabriel Jimenez"
      - add_ssh_keys:
          fingerprints:
            - "0a:8a:6d:3a:22:28:74:a8:9e:a6:72:5d:bc:2b:aa:fe"
      - run: mvn --settings ".circleci/settings.xml" --batch-mode --define style.color=always --errors --activate-profiles release -define scmCommentPrefix="[skip ci]" release:clean release:prepare release:perform  # uses maven-release-plugin

  # RELEASE Deploy to Maven Central
  release-maven-central-deploy-job:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - synapse-{{ checksum "pom.xml" }}
            - synapse-
      - configure-gpg
      - run: mvn --settings ".circleci/settings.xml" --batch-mode --define style.color=always --errors --activate-profiles release --define skipTests clean deploy # uses maven-deploy-plugin

#-------------------------------------------------------
# Workflows that will schedule and execute jobs.
#-------------------------------------------------------
workflows:
  # Branch with Snapshot Modifier
  # This workflow is to start automatically when creating any new feature branches and when pushing any changes to feature or develop branches
  snapshot-maven-central-build-test-deploy-workflow:
    jobs:
      - build-test-job:
          filters:
            branches:
              only:
                - /develop
                - /feature.*/
                - /bugfix.*/
                - /dependabot.*/
      - snapshot-maven-central-deploy-job:
          filters:
            branches:
              only:
                - /develop
                - /feature.*/
                - /bugfix.*/
                - /dependabot.*/
          context:
            - maven_central_credentials
            - code_signing_credentials
          requires:
            - build-test-job

  # Main Branch
  # This workflow is to start automatically when merging any changes to the main branch
  release-maven-central-build-test-deploy-workflow:
    jobs:
      - build-test-job:
          filters:
            branches:
              only:
                - main
      - release-maven-central-deploy-job:
          filters:
            branches:
              only:
                - main
          context:
            - maven_central_credentials
            - code_signing_credentials
          requires:
            - build-test-job

#  # Release Branch
#  # This workflow is to start automatically when creating any new release branches and when pushing any changes to release branches
  snapshot-release-maven-central-build-test-deploy-workflow:
    jobs:
      - build-test-job:
          filters:
            branches:
              only:
                - /release.*/
      - snapshot-release-maven-central-deploy-job:
          filters:
            branches:
              only:
                - /release.*/
          context:
            - maven_central_credentials
            - code_signing_credentials
          requires:
            - build-test-job
